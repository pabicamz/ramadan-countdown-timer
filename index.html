    <title>Ramadan Coundown Timer</title>

    <!-- live date & time -->
    <p class="live-time"></p>
    <!-- the main section -->
    <section class="section">
      <h1 class="section-header">Ramadan Countdown</h1>
      <div class="section-container">
        <div class="format">
          <!-- days -->
          <div class="deadline-format">
            <p>days</p>
            <div>
              <p class="days">00</p>
            </div>
          </div>
          <!-- hours -->
          <div class="deadline-format">
            <p>hours</p>
            <div><p class="hours">00</p></div>
          </div>
          <!-- minutes -->
          <div class="deadline-format">
            <p>minutes</p>
            <div><p class="minutes">00</p></div>
          </div>
          <!-- seconds -->
          <div class="deadline-format">
            <p>seconds</p>
            <div><p class="seconds">00</p></div>
          </div>
        </div>
        <div class="text-info">
          <p>
            Ramadan 1448H will, inshaAllah, be coming on
            <span>February 7, 2027</span>
          </p>
        </div>
      </div>
    </section>
