<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style/style.css" />
    <title>Ramadan Coundown Timer</title>
  </head>
  <body>

    <!-- live date & time -->
    <p class="live-time"></p>
    
    <!-- the main section -->
    <section class="section">
      <h1 class="section-header"></h1>
      <div class="section-container">
        <div class="format">
          <!-- days -->
          <div class="deadline-format">
            <p>days</p>
            <div>
              <p class="days">00</p>
            </div>
          </div>
          <!-- hours -->
          <div class="deadline-format">
            <p>hours</p>
            <div><p class="hours">00</p></div>
          </div>
          <!-- minutes -->
          <div class="deadline-format">
            <p>minutes</p>
            <div><p class="minutes">00</p></div>
          </div>
          <!-- seconds -->
          <div class="deadline-format">
            <p>seconds</p>
            <div><p class="seconds">00</p></div>
          </div>
        </div>
        <div class="text-info">
          <p>
            Ramadan 1448H will, inshaAllah, be coming on
            <span>February 7, 2027</span>
          </p>
        </div>
      </div>
    </section>

    <!-- footer -->
    <footer class="footer">
      <div class="footer-contents">
        <a
          href="https://instagram.com/dev.camz"
          target="_blank"
          rel="noopener noreferrer"
          >Instagram</a
        >
        <span class="divider">/</span>
        <a
          href="https://www.linkedin.com/in/karamo-camara-ab4619339/?skipRedirect=true"
          target="_blank"
          rel="noopener noreferrer"
          >LinkedIn</a
        >
        <span class="divider">/</span>
        <a
          href="https://ramadan.zakiego.com/api/countdown"
          target="_blank"
          rel="noopener noreferrer"
          >API</a
        >
        <span class="divider">/</span>
        <p class="copyright">Copyright &copy; 2026 by Karamo</p>
      </div>
    </footer>

    <script src="script/script.js"></script>
  </body>
</html>
